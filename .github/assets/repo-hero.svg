<svg width="1200" height="480" viewBox="0 0 1200 480" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1200" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <linearGradient id="glow-red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#b91c1c" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="glow-emerald" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#065f46" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="glow-blue" x1="0.5" y1="1" x2="0.5" y2="0">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#1e3a8a" stop-opacity="0" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="card-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>

    <!-- Badge Gradients -->
    <linearGradient id="badge-green" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <linearGradient id="badge-red" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>

    <linearGradient id="text-gradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <!-- Filters -->
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45" />
    </filter>

    <filter id="subtle-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .title { font-weight: 800; fill: url(#text-gradient); }
    .subtitle { font-weight: 500; fill: #94a3b8; }
    .card-title { font-weight: 700; fill: #f1f5f9; }
    .card-desc { font-weight: 400; fill: #94a3b8; }
    .badge-text { font-weight: 700; font-size: 13px; }
  </style>

  <!-- Canvas Background -->
  <rect width="1200" height="480" rx="24" fill="url(#bg-grad)" />
  <rect width="1198" height="478" x="1" y="1" rx="23" stroke="#334155" stroke-opacity="0.4" stroke-width="1.5" />

  <!-- Ambient Light Orbs -->
  <circle cx="160" cy="90" r="240" fill="url(#glow-red)" />
  <circle cx="1060" cy="110" r="260" fill="url(#glow-emerald)" />
  <circle cx="620" cy="460" r="260" fill="url(#glow-blue)" />

  <!-- Subtle Grid Lines -->
  <g opacity="0.07" stroke="#ffffff" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="480" />
    <line x1="240" y1="0" x2="240" y2="480" />
    <line x1="400" y1="0" x2="400" y2="480" />
    <line x1="560" y1="0" x2="560" y2="480" />
    <line x1="720" y1="0" x2="720" y2="480" />
    <line x1="880" y1="0" x2="880" y2="480" />
    <line x1="1040" y1="0" x2="1040" y2="480" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="360" x2="1200" y2="360" />
  </g>

  <!-- TOP PILL BADGE: Privacy Guarantee -->
  <g transform="translate(64, 46)">
    <rect width="362" height="34" rx="17" fill="#064e3b" fill-opacity="0.65" stroke="#059669" stroke-width="1" />
    <!-- Shield Icon -->
    <path d="M16 10 L24 6 L32 10 C32 18 24 23 24 23 C24 23 16 18 16 10 Z" fill="#10b981" />
    <path d="M21 14.5 L23.5 17 L27 12.5" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    <text class="font-sans badge-text" x="42" y="22" fill="#34d399">100% CLIENT-SIDE • ZERO SERVER UPLOADS</text>
  </g>

  <!-- SECOND BADGE: Open Source -->
  <g transform="translate(438, 46)">
    <rect width="186" height="34" rx="17" fill="#1e293b" fill-opacity="0.8" stroke="#475569" stroke-width="1" />
    <circle cx="20" cy="17" r="4.5" fill="#38bdf8" />
    <text class="font-sans badge-text" x="34" y="22" fill="#cbd5e1">29+ BROWSER TOOLS</text>
  </g>

  <!-- MAIN HEADLINE -->
  <text class="font-sans title" x="64" y="142" font-size="46" letter-spacing="-1.2">
    Private PDF Tools. Right In Your Browser.
  </text>

  <!-- SUBHEADLINE -->
  <text class="font-sans subtitle" x="64" y="184" font-size="20">
    Process contracts, invoices, and sensitive documents entirely on your device with no cloud leaks.
  </text>

  <!-- 4 FEATURE HIGHLIGHT CARDS -->
  <g transform="translate(64, 230)">
    <!-- CARD 1: Organize & Merge -->
    <g transform="translate(0, 0)" filter="url(#card-shadow)">
      <rect width="252" height="190" rx="18" fill="url(#card-bg)" stroke="#334155" stroke-opacity="0.7" stroke-width="1" />
      <rect width="252" height="4" rx="2" fill="#ef4444" />
      
      <!-- Icon Container -->
      <rect x="20" y="22" width="46" height="46" rx="12" fill="#ef4444" fill-opacity="0.15" stroke="#ef4444" stroke-opacity="0.3" />
      <!-- Merge Icon -->
      <path d="M35 37 L51 37 M43 29 L51 37 L43 45" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M31 31 L31 43" stroke="#fca5a5" stroke-width="2.5" stroke-linecap="round" />
      
      <text class="font-sans card-title" x="20" y="98" font-size="18">Organize &amp; Merge</text>
      <text class="font-sans card-desc" x="20" y="125" font-size="14">Combine, split, reorder,</text>
      <text class="font-sans card-desc" x="20" y="147" font-size="14">rotate, and delete pages</text>
      <text class="font-sans card-desc" x="20" y="169" font-size="14">with live visual previews.</text>
    </g>

    <!-- CARD 2: Convert & Shrink -->
    <g transform="translate(274, 0)" filter="url(#card-shadow)">
      <rect width="252" height="190" rx="18" fill="url(#card-bg)" stroke="#334155" stroke-opacity="0.7" stroke-width="1" />
      <rect width="252" height="4" rx="2" fill="#3b82f6" />
      
      <!-- Icon Container -->
      <rect x="20" y="22" width="46" height="46" rx="12" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-opacity="0.3" />
      <!-- Convert Icon -->
      <path d="M31 45 V33 C31 30 33 28 36 28 H47" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round" />
      <path d="M43 24 L48 28 L43 32" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M51 31 V43 C51 46 49 48 46 48 H35" stroke="#93c5fd" stroke-width="2.5" stroke-linecap="round" />
      <path d="M39 52 L34 48 L39 44" stroke="#93c5fd" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

      <text class="font-sans card-title" x="20" y="98" font-size="18">Convert &amp; Compress</text>
      <text class="font-sans card-desc" x="20" y="125" font-size="14">High-efficiency PDF to</text>
      <text class="font-sans card-desc" x="20" y="147" font-size="14">JPG/PNG/WebP, photo to PDF,</text>
      <text class="font-sans card-desc" x="20" y="169" font-size="14">and multi-level compression.</text>
    </g>

    <!-- CARD 3: Sign & Protect -->
    <g transform="translate(548, 0)" filter="url(#card-shadow)">
      <rect width="252" height="190" rx="18" fill="url(#card-bg)" stroke="#334155" stroke-opacity="0.7" stroke-width="1" />
      <rect width="252" height="4" rx="2" fill="#10b981" />
      
      <!-- Icon Container -->
      <rect x="20" y="22" width="46" height="46" rx="12" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.3" />
      <!-- Lock / Key Icon -->
      <rect x="33" y="34" width="20" height="16" rx="4" stroke="#10b981" stroke-width="2.5" fill="none" />
      <path d="M37 34 V30 C37 26.5 39.5 24 43 24 C46.5 24 49 26.5 49 30 V34" stroke="#6ee7b7" stroke-width="2.5" stroke-linecap="round" />
      <circle cx="43" cy="42" r="2" fill="#10b981" />

      <text class="font-sans card-title" x="20" y="98" font-size="18">Sign &amp; Protect</text>
      <text class="font-sans card-desc" x="20" y="125" font-size="14">Canvas e-signatures,</text>
      <text class="font-sans card-desc" x="20" y="147" font-size="14">AES encryption passwords,</text>
      <text class="font-sans card-desc" x="20" y="169" font-size="14">watermarks, and sanitization.</text>
    </g>

    <!-- CARD 4: OCR & Clean -->
    <g transform="translate(822, 0)" filter="url(#card-shadow)">
      <rect width="252" height="190" rx="18" fill="url(#card-bg)" stroke="#334155" stroke-opacity="0.7" stroke-width="1" />
      <rect width="252" height="4" rx="2" fill="#8b5cf6" />
      
      <!-- Icon Container -->
      <rect x="20" y="22" width="46" height="46" rx="12" fill="#8b5cf6" fill-opacity="0.15" stroke="#8b5cf6" stroke-opacity="0.3" />
      <!-- OCR Eye / Text Icon -->
      <path d="M30 44 L41 26 L47 36 L52 28" stroke="#8b5cf6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="48" cy="27" r="3" fill="#c4b5fd" />
      <line x1="30" y1="46" x2="54" y2="46" stroke="#c4b5fd" stroke-width="2" stroke-linecap="round" />

      <text class="font-sans card-title" x="20" y="98" font-size="18">OCR &amp; Clean</text>
      <text class="font-sans card-desc" x="20" y="125" font-size="14">Browser text recognition,</text>
      <text class="font-sans card-desc" x="20" y="147" font-size="14">metadata removal,</text>
      <text class="font-sans card-desc" x="20" y="169" font-size="14">flattening, and PDF repair.</text>
    </g>
  </g>
</svg>
